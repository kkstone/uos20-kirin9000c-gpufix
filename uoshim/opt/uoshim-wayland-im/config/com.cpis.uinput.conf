<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.cpis.uinput"/>
    <allow send_destination="com.cpis.uinput"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.cpis.uinput" send_interface="com.cpis.uinput"/>
    <allow send_destination="com.cpis.uinput" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.cpis.uinput" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
